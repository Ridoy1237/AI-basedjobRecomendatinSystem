<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Applications </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">✦</span><span>Job Recommendation System<span></span></span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a><a href="jobs.html">Explore Jobs</a>
      <a class="active" href="my-applications.html">My Applications</a><a href="profile.html">My Profile</a>
    </nav>
  </header>
  <main class="applications-shell">
    <div class="applications-heading">
      <div><span class="section-kicker">YOUR CAREER ACTIVITY</span><h1>My Applications</h1><p>Review the jobs you have applied for and check their current status.</p></div>
      <a class="btn" href="jobs.html">Explore More Jobs →</a>
    </div>
    <div id="applicationsContainer"></div>
  </main>
  <script src="script.js"></script>
  <script>
    const applicationsContainer = document.getElementById("applicationsContainer");
    const studentData = JSON.parse(localStorage.getItem("studentData") || "null");
    const allApplications = JSON.parse(localStorage.getItem("jobApplications") || "[]");

    function displayApplications() {
      applicationsContainer.innerHTML = "";
      if (!studentData) {
        applicationsContainer.innerHTML = '<div class="empty-message"><h3>Create your student profile first</h3><p>Register to start applying for opportunities.</p><br><a class="btn btn-small" href="register.html">Create Profile</a></div>';
        return;
      }
      const myApplications = allApplications.filter(function(application) {
        return (application.email || "").toLowerCase() === (studentData.email || "").toLowerCase();
      });
      if (myApplications.length === 0) {
        applicationsContainer.innerHTML = '<div class="empty-message"><h3>No applications yet</h3><p>When you apply for a job, it will appear here.</p><br><a class="btn btn-small" href="jobs.html">Browse Jobs</a></div>';
        return;
      }
      myApplications.slice().reverse().forEach(function(application) {
        const card = document.createElement("article");
        card.className = "application-card";
        const title = document.createElement("h3");
        title.textContent = application.jobTitle || "Untitled opportunity";
        card.appendChild(title);
        const fields = [
          ["Company", application.company],
          ["Applicant", application.studentName],
          ["Email", application.email],
          ["Applied Date", application.appliedAt]
        ];
        fields.forEach(function(field) {
          const p = document.createElement("p");
          const strong = document.createElement("strong");
          strong.textContent = field[0] + ": ";
          p.appendChild(strong);
          p.appendChild(document.createTextNode(field[1] || "Not available"));
          card.appendChild(p);
        });
        const statusLine = document.createElement("p");
        const statusLabel = document.createElement("strong");
        statusLabel.textContent = "Status: ";
        const status = document.createElement("span");
        status.className = "status";
        status.textContent = application.status || "Pending";
        statusLine.append(statusLabel, status);
        card.appendChild(statusLine);
        applicationsContainer.appendChild(card);
      });
    }
    displayApplications();
  </script>
</body>
</html>
